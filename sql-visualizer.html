<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQL Visualizer</title>
<style>
  :root {
    --bg: #0a0a0c;
    --panel: #121217;
    --panel-2: #1a1a20;
    --border: #23232b;
    --text: #e6edf3;
    --muted: #8b98a5;
    --accent: #4f9cf9;
    --accent-2: #7c5cff;
    --green: #10b981;
    --yellow: #d29922;
    --red: #f85149;
    --orange: #db6d28;
    --cyan: #39c5cf;
    --indigo: #4f46e5;
    --purple: #a855f7;
    --violet: #8b5cf6;
    --pink: #ec4899;
    --amber: #f59e0b;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono: "SF Mono", "Cascadia Code", "Fira Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-ui);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    padding: 12px 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  header .logo { color: var(--accent); }
  header .spacer { flex: 1; }
  header button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: all .15s;
  }
  header button:hover { border-color: var(--accent); color: var(--accent); }
  header button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  header button.primary:hover { background: #3b87e0; }

  .app-main { flex: 1; display: flex; min-height: 0; }
  .left {
    width: 40%;
    min-width: 320px;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
  }
  .editors { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .er {
    flex: 1;
    overflow: auto;
    background-color: #060608;
    background-image: radial-gradient(#1c1c21 1px, transparent 1px);
    background-size: 24px 24px;
    background-position: 12px 12px;
    padding: 14px;
  }
  .er svg { display: block; }

  /* ---- table origin styles ---- */
  .er-card { fill: #16161a; stroke: rgba(255,255,255,0.10); stroke-width: 1.5; }
  .er-card.subq { fill: url(#erSubqGrad); stroke: rgba(168,85,247,0.80); }
  .er-card.cte { fill: #0f1a1a; stroke: rgba(20,184,166,0.60); }
  .er-card.manual { fill: #16161a; stroke: rgba(16,185,129,0.35); }
  .er-table .thead-rect { fill: rgba(148,163,184,0.12); }
  .er-table.subq .thead-rect { fill: rgba(168,85,247,0.20); }
  .er-table.cte .thead-rect { fill: rgba(20,184,166,0.15); }
  .er-table.manual .thead-rect { fill: rgba(16,185,129,0.20); }
  .er-table .tname { fill: #e6edf3; font: 600 13px var(--font-mono); }
  .er-table .trow { fill: #9aa4b2; font: 11px var(--font-mono); }
  .er-table.subq .tname { fill: #e9d5ff; }
  .er-table.cte .tname { fill: #ccfbf1; }
  .er-table.manual .tname { fill: #d1fae5; }

  .er-origin { stroke-width: 0; }
  .er-origin.std { fill: #6366f1; }
  .er-origin.subq { fill: #a855f7; }
  .er-origin.cte { fill: #14b8a6; }
  .er-origin.manual { fill: #10b981; }

  /* CTE grouping background */
  .er-cte-group { fill: rgba(20,184,166,0.04); stroke: rgba(20,184,166,0.25); stroke-width: 1; stroke-dasharray: 6 3; rx: 12; }
  .er-cte-label { fill: rgba(20,184,166,0.55); font: 600 11px var(--font-mono); }

  .er-joinrow { fill: rgba(99,102,241,0.16); stroke: rgba(99,102,241,0.45); stroke-width: 1; transition: opacity .15s; }
  .er-table .trow.join-col { fill: #c7d2fe; font-weight: 700; transition: opacity .15s; }
  /* only highlight the ACTIVE join's columns; dim the rest under hover */
  .er svg.has-hover .er-joinrow { opacity: .12; }
  .er svg.has-hover .trow.join-col { fill: var(--muted); font-weight: 400; }
  .er svg.has-hover .er-joinrow.active { opacity: 1; }
  .er svg.has-hover .trow.join-col.active { fill: #c7d2fe; font-weight: 700; }

  /* column badges */
  .er-cbadge { font: 700 8px var(--font-mono); letter-spacing: .3px; }
  .er-cbadge.pk { fill: #c7d2fe; }
  .er-cbadge.grp { fill: #fbbf24; }
  .er-cbadge.sort { fill: #c4b5fd; }
  .er-cbadge.filt { fill: #6ee7b7; }
  .er-cbadge.case { fill: #a5b4fc; }

  .er-port { filter: drop-shadow(0 0 4px currentColor); }
  .er-badge { cursor: default; }
  .er-badge rect { opacity: .95; }
  .er-badge-txt { fill: #fff; font: 700 10px var(--font-mono); letter-spacing: .4px; }
  .er-badge-txt.dark { fill: #0a0a0c; }
  .er-line { fill: none; transition: stroke-width .12s; }
  .er-glow { opacity: 0; transition: opacity .12s; pointer-events: none; }
  .er-hit { cursor: pointer; }
  .er-join:hover .er-glow { opacity: .55; }
  .er-join:hover .er-line { stroke-width: 3; }

  /* hover dimming: when canvas has .dim, non-hovered fade */
  .er svg.has-hover .er-table,
  .er svg.has-hover .er-join { transition: opacity .15s; }
  .er svg.has-hover .er-table.faded,
  .er svg.has-hover .er-join.faded { opacity: .15; }

  .er-empty { color: var(--muted); font-size: 12.5px; padding: 8px 4px; }
  .er-head { display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .er-toggle { font-size: 11px; color: var(--muted); padding: 0 14px 2px 0; cursor: pointer; user-select: none; }
  .er-toggle input { vertical-align: -1px; margin-right: 4px; accent-color: var(--accent); }
  /* ER tab bar */
  .er-tabs {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding: 8px 14px 4px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .er-tab {
    background: var(--panel-2);
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 4px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-family: var(--font-ui);
    transition: all .15s;
  }
  .er-tab:hover { border-color: var(--accent); color: var(--accent); }
  .er-tab.active {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
  .er-tab.subq { border-left: 3px solid var(--purple); }
  .er-tab.cte { border-left: 3px solid var(--cyan); }
  .er-head button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    transition: all .15s;
  }
  .er-head button:hover { border-color: var(--accent); color: var(--accent); }
  /* full-screen ER overlay */
  body.er-fullscreen .er-head { position: sticky; top: 0; background: var(--panel); z-index: 5; }
  #erFullscreenOverlay {
    position: fixed; inset: 0; z-index: 1000;
    background: var(--bg);
    display: none; flex-direction: column;
  }
  #erFullscreenOverlay.open { display: flex; }
  #erFullscreenOverlay .er-fs-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
    flex-shrink: 0;
  }
  #erFullscreenOverlay .er-fs-head .label { padding: 0; }
  #erFullscreenOverlay .er {
    flex: 1; overflow: auto;
    background-color: #060608;
    background-image: radial-gradient(#1c1c21 1px, transparent 1px);
    background-size: 24px 24px; background-position: 12px 12px;
    padding: 14px;
  }
  #erFullscreenOverlay .er-fs-head button {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); padding: 6px 12px;
    border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  #erFullscreenOverlay .er-fs-head button:hover { border-color: var(--accent); color: var(--accent); }
  .sql-wrap { flex: 1; display: flex; flex-direction: column; min-height: 0; border-bottom: 1px solid var(--border); }
  .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: var(--muted);
    padding: 8px 14px 4px;
  }
  textarea {
    flex: 1;
    background: #0b0f14;
    color: var(--text);
    border: none;
    padding: 12px 14px;
    font-family: "SF Mono", "Cascadia Code", Consolas, monospace;
    font-size: 13.5px;
    line-height: 1.55;
    resize: none;
    outline: none;
    tab-size: 2;
  }
  .right {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--bg);
  }
  .pipeline {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .stage {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    position: relative;
    animation: fadeIn .25s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px);} to {opacity:1; transform:none;} }
  .stage-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .stage-num {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: grid; place-items: center;
    font-size: 12px; font-weight: 700;
    flex-shrink: 0;
  }
  .stage-title { font-weight: 600; font-size: 14px; }
  .stage-type {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: .6px;
    padding: 2px 8px;
    border-radius: 20px;
    background: var(--panel-2);
    color: var(--muted);
    margin-left: auto;
  }
  .stage-desc { color: var(--muted); font-size: 12.5px; margin-bottom: 10px; line-height: 1.5; overflow-wrap: anywhere; }
  .stage-body { font-size: 13px; line-height: 1.55; overflow-wrap: anywhere; }
  .chip {
    display: inline-block;
    padding: 2px 9px;
    margin: 3px 4px 3px 0;
    border-radius: 6px;
    font-family: monospace;
    font-size: 12.5px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    word-break: break-word;
    max-width: 100%;
    overflow-wrap: anywhere;
  }
  .chip.col { color: var(--cyan); border-color: #1c4a4d; }
  .chip.table { color: var(--green); border-color: #1c4a26; }
  .chip.kw { color: var(--accent-2); border-color: #3a2c66; }
  .chip.cond { color: var(--yellow); border-color: #4a3a14; }
  .chip.case { color: var(--orange); border-color: #4a2e14; }
  .chip.agg { color: var(--red); border-color: #4a1c1c; }
  .arrow {
    text-align: center;
    color: var(--muted);
    margin: 6px 0;
    font-size: 18px;
    line-height: 1;
  }
  .arrow::before { content: "▼"; }
  .join-viz {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: var(--panel-2);
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 4px;
  }
  .join-table {
    padding: 6px 12px;
    border-radius: 6px;
    background: #16211a;
    border: 1px solid #1c4a26;
    color: var(--green);
    font-family: monospace;
    font-size: 12.5px;
  }
  .join-op { font-size: 11px; color: var(--accent-2); text-align: center; max-width: 150px; }
  .join-table .small-alias { color: var(--muted); font-size: 11px; }
  .join-help { margin-top: 4px; color: var(--muted); font-size: 10.5px; font-weight: normal; line-height: 1.3; }
  .case-box {
    background: var(--panel-2);
    border-left: 3px solid var(--orange);
    border-radius: 4px;
    padding: 8px 12px;
    margin: 6px 0;
    font-size: 12.5px;
    font-family: monospace;
  }
  .case-box .when { color: var(--yellow); }
  .case-box .then { color: var(--cyan); }
  .case-box .else { color: var(--muted); }
  .window-box {
    background: var(--panel-2);
    border-left: 3px solid var(--violet);
    border-radius: 4px;
    padding: 8px 12px;
    margin: 6px 0;
    font-size: 12.5px;
    font-family: monospace;
  }
  .window-box .over-title { color: var(--violet); font-weight: bold; }
  .order-dir { font-size: 11px; }
  .order-dir.asc { color: var(--green); }
  .order-dir.desc { color: var(--red); }
  .empty-state {
    text-align: center;
    color: var(--muted);
    margin-top: 60px;
    font-size: 14px;
  }
  .error {
    background: #2a1416;
    border: 1px solid #4a1c1c;
    color: var(--red);
    padding: 12px 16px;
    border-radius: 8px;
    font-family: monospace;
    font-size: 13px;
  }
  .diagram {
    margin-top: 10px;
    background: var(--panel-2);
    border-radius: 8px;
    padding: 14px;
    text-align: center;
  }
  .diagram svg { max-width: 100%; }
  .legend {
    display: flex; gap: 14px; flex-wrap: wrap;
    padding: 8px 18px;
    font-size: 11px; color: var(--muted);
    border-top: 1px solid var(--border);
    background: var(--panel);
    flex-shrink: 0;
  }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .scrollbar::-webkit-scrollbar, .pipeline::-webkit-scrollbar { width: 10px; }
  .pipeline::-webkit-scrollbar-thumb { background: #2d3742; border-radius: 5px; }
  .pipeline::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<header>
  <h1><span class="logo">⛁</span> SQL Visualizer</h1>
  <span style="color:var(--muted);font-size:12px;">See how your query executes, step by step</span>
  <div class="spacer"></div>
  <button id="clearBtn">Clear</button>
</header>

<div class="app-main">
  <div class="left">
    <div class="editors">
      <div class="sql-wrap">
        <div class="label">SQL Query</div>
        <textarea id="sql" spellcheck="false" placeholder="SELECT ..."></textarea>
      </div>
      <div class="sql-wrap" id="erWrap" style="min-height:38%;flex:1 1 38%;">
        <div class="er-head">
          <div class="label" style="padding:8px 14px 4px;">Table Relationships (from JOINs)</div>
          <span style="display:flex;align-items:center;gap:12px;">
            <label class="er-toggle"><input type="checkbox" id="erAllCols"> Show all columns</label>
            <button id="erFullscreen" title="Toggle full screen">⛶ Full screen</button>
          </span>
        </div>
        <div id="erDiagram" class="er"></div>
      </div>
    </div>
  </div>

  <div class="right">
    <div class="pipeline" id="pipeline">
      <div class="empty-state">Run <b>Visualize</b> to break this query into logical execution stages.</div>
    </div>
    <div class="legend">
      <span><i style="background:var(--cyan)"></i>column</span>
      <span><i style="background:var(--green)"></i>table</span>
      <span><i style="background:var(--accent-2)"></i>keyword</span>
      <span><i style="background:var(--yellow)"></i>condition</span>
      <span><i style="background:var(--orange)"></i>case</span>
      <span><i style="background:var(--red)"></i>aggregate</span>
    </div>
  </div>
</div>

<div id="erFullscreenOverlay">
  <div class="er-fs-head">
    <div class="label">Table Relationships (from JOINs) — full screen</div>
    <span style="display:flex;align-items:center;gap:12px;">
      <label class="er-toggle"><input type="checkbox" id="erAllColsFs"> Show all columns</label>
      <button id="erFullscreenExit">✕ Exit full screen (Esc)</button>
    </span>
  </div>
  <div id="erDiagramFs" class="er"></div>
</div>

<script>
"use strict";

// ---------- Tokenizer ----------
function tokenize(sql) {
  const tokens = [];
  const re = /\/\*[\s\S]*?\*\/|\s+|--[^\n]*|#[^\n]*|'(?:[^']|'')*'|`[^`]*`|"[^"]*"|[(),.;*]|\d+(?:\.\d+)?(?:[eE][+-]?\d+)?|>=|<=|<>|!=|=|>|<|\+|-|\/|%|\b[a-zA-Z_][a-zA-Z0-9_]*\b/g;
  let m;
  while ((m = re.exec(sql)) !== null) {
    const t = m[0];
    if (/^\s+$/.test(t) || t.startsWith("--") || t.startsWith("/*") || t.startsWith("#")) continue;
    let type = "sym";
    if (/^[a-zA-Z_]/.test(t)) type = "word";
    else if (/^\d/.test(t)) type = "num";
    else if (/^'.*'$/.test(t)) type = "str";
    else if (/^[(),.;*]$/.test(t)) type = "punc";
    tokens.push({ v: t, type, i: m.index });
  }
  return tokens;
}

const KEYWORDS = new Set([
  "select","from","where","group","by","order","having","join","inner","left",
  "right","full","outer","on","as","and","or","not","in","like","between","is",
  "null","distinct","limit","union","case","when","then","else","end","asc","desc",
  "cross","using","with","over","partition","union","all","top","into",
  "qualify","window","tablesample","struct","pivot","unpivot","cluster",
  "recursive","except","replace","intersect","offset","value","values",
  "table","each","hash","sample","tumble","hop","session"
]);
const AGGREGATES = new Set(["count","sum","avg","min","max","group_concat","string_agg","array_agg",
  "approx_count_distinct","approx_quantiles","approx_top_count","countif","any_value","bit_and",
  "bit_or","bit_xor","logical_and","logical_or","stddev","stddev_samp","stddev_pop","variance",
  "var_samp","var_pop","corr","covar_pop","covar_samp","array_length"]);

function isKeyword(w){ return KEYWORDS.has(w.toLowerCase()); }
function isAgg(w){ return AGGREGATES.has(w.toLowerCase()); }

// segment tokens into top-level clause groups.
// Only the major clause heads start a new group; sub-keywords (AS, ON, BY,
// ASC, DESC, AND, OR, ...) stay inside their parent clause.
const JOIN_MODS = ["inner","left","right","full","outer","cross","natural"];
const JOIN_HELP = {
  inner: "Keep only rows that match in BOTH tables.",
  left: "Keep all rows from the left table; fill unmatched right columns with NULL.",
  right: "Keep all rows from the right table; fill unmatched left columns with NULL.",
  full: "Keep all rows from BOTH tables; fill unmatched sides with NULL.",
  cross: "Pair every row of the left table with every row of the right (cartesian product).",
  outer: "Same as FULL: keep all rows from both tables."
};
function isClauseHead(toks, i) {
  const w = toks[i].v.toLowerCase();
  // multi-word heads first
  const multi = {
    "order": "by", "group": "by", "union": "all", "cluster": "by", "partition": "by"
  };
  if (multi[w] && i + 1 < toks.length && toks[i+1].v.toLowerCase() === multi[w]) return 2;
  // join clause head: a direction modifier (optionally followed by OUTER)
  // immediately followed by JOIN, e.g. "LEFT JOIN" or "LEFT OUTER JOIN".
  // "OUTER" alone is a qualifier meaning FULL (e.g. "OUTER JOIN" == FULL OUTER JOIN).
  if (w !== "outer" && JOIN_MODS.includes(w) && i + 1 < toks.length) {
    let j = i + 1;
    if (toks[j].v.toLowerCase() === "outer") j++;
    if (j < toks.length && toks[j].v.toLowerCase() === "join") return j - i + 1;
  } else if (w === "outer" && i + 1 < toks.length && toks[i+1].v.toLowerCase() === "join") {
    // bare OUTER JOIN means FULL OUTER JOIN; kw "outer join" detects as FULL
    return 2;
  }
  // single-word heads
  if (["select","from","where","having","join","limit","union","qualify","window","tablesample","offset"].includes(w)) return 1;
  return 0;
}
function splitClauses(tokens) {
  const clauses = [];
  let cur = null;
  let depth = 0;
  for (let i = 0; i < tokens.length; i++) {
    const tk = tokens[i];
    if (tk.v === "(") depth++;
    else if (tk.v === ")") depth--;
    if (tk.type === "word" && depth === 0) {
      const span = isClauseHead(tokens, i);
      if (span) {
        cur = { kw: tokens.slice(i, i+span).map(t => t.v.toLowerCase()).join(" "), toks: [] };
        clauses.push(cur);
        i += span - 1; // skip consumed head tokens
        continue;
      }
    }
    if (cur) cur.toks.push(tk);
  }
  return clauses;
}

// parse a comma-separated expression list from a token array (respecting parens)
function splitTopLevelCommas(toks) {
  const parts = [];
  let depth = 0, cur = [];
  for (const t of toks) {
    if (t.v === "(") depth++;
    else if (t.v === ")") depth--;
    if (t.v === "," && depth === 0) { parts.push(cur); cur = []; }
    else cur.push(t);
  }
  if (cur.length) parts.push(cur);
  return parts;
}

function toText(toks){
  return toks.map((t, k) => {
    const prev = toks[k-1];
    let s = t.v;
    if (prev) {
      const prevIsContent = prev.type === "word" || prev.type === "str" || prev.type === "sym" || prev.type === "num";
      const curIsContent = t.type === "word" || t.type === "str" || t.type === "sym" || t.type === "num";
      if (prevIsContent && curIsContent) s = " " + s;
    }
    return s;
  }).join("").replace(/\s+/g," ").trim();
}

// ---------- Main analysis ----------
function containsWindowFunc(toks) {
  for (let i = 0; i < toks.length - 1; i++) {
    if (toks[i].type === "word" && toks[i].v.toLowerCase() === "over" && toks[i+1].v === "(") {
      return i;
    }
  }
  return -1;
}

function renderWindowFunc(toks, overIdx) {
  const funcToks = toks.slice(0, overIdx);
  let depth = 0, openIdx = overIdx + 1;
  let closeIdx = -1;
  for (let k = openIdx; k < toks.length; k++) {
    if (toks[k].v === "(") depth++;
    else if (toks[k].v === ")") {
      depth--;
      if (depth === 0) { closeIdx = k; break; }
    }
  }
  const specToks = closeIdx > 0 ? toks.slice(openIdx + 1, closeIdx) : [];
  
  let partToks = [], orderToks = [];
  let currentKey = "";
  for (let i = 0; i < specToks.length; i++) {
    const t = specToks[i];
    const w = t.v.toLowerCase();
    if (w === "partition" && specToks[i+1] && specToks[i+1].v.toLowerCase() === "by") {
      currentKey = "partition";
      i++;
    } else if (w === "order" && specToks[i+1] && specToks[i+1].v.toLowerCase() === "by") {
      currentKey = "order";
      i++;
    } else {
      if (currentKey === "partition") partToks.push(t);
      else if (currentKey === "order") orderToks.push(t);
    }
  }

  let html = `<div class="window-box">`;
  html += `<div><span class="chip col">${esc(toText(funcToks))}</span> <span class="over-title">OVER</span></div>`;
  if (partToks.length) {
    const cols = splitTopLevelCommas(partToks).map(p => toText(p)).filter(Boolean);
    html += `<div style="margin-top:4px;padding-left:12px;color:var(--muted);font-size:11.5px;">`;
    html += `PARTITION BY ` + cols.map(c => `<span class="chip col">${esc(c)}</span>`).join(" ");
    html += `</div>`;
  }
  if (orderToks.length) {
    const parts = splitTopLevelCommas(orderToks);
    let orderHtml = "";
    parts.forEach(p => {
      let dir = "asc", toks = p;
      if (toks.length >= 1) {
        const last = toks[toks.length-1];
        if (last.type === "word" && /^(asc|desc)$/i.test(last.v)) {
          dir = last.v.toLowerCase(); toks = toks.slice(0, -1);
        }
      }
      orderHtml += `<span class="chip col">${esc(toText(toks))}</span> <span class="order-dir ${dir}">${dir.toUpperCase()}</span> `;
    });
    html += `<div style="margin-top:4px;padding-left:12px;color:var(--muted);font-size:11.5px;">`;
    html += `ORDER BY ` + orderHtml;
    html += `</div>`;
  }
  if (!partToks.length && !orderToks.length && specToks.length) {
    html += `<div style="margin-top:4px;padding-left:12px;color:var(--muted);font-size:11.5px;">`;
    html += `<span class="chip cond">${esc(toText(specToks))}</span>`;
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}

function splitUnionLegs(tokens) {
  const legs = [];
  let cur = [];
  let depth = 0;
  for (let i = 0; i < tokens.length; i++) {
    const t = tokens[i];
    if (t.v === "(") depth++;
    else if (t.v === ")") depth--;

    if (depth === 0 && t.type === "word" && ["union", "intersect", "except"].includes(t.v.toLowerCase())) {
      let op = t.v.toUpperCase();
      let next = tokens[i+1];
      if (next && next.type === "word" && next.v.toLowerCase() === "all") {
        op += " ALL";
        i++;
      }
      legs.push({ toks: cur, nextOp: op });
      cur = [];
    } else {
      cur.push(t);
    }
  }
  if (cur.length) {
    legs.push({ toks: cur, nextOp: null });
  }
  return legs;
}

function analyzeLeg(tokens, legPrefix = "") {
  const clauses = splitClauses(tokens);
  const stages = [];

  const get = (k) => clauses.find(c => c.kw === k || c.kw === k + " by");

  // FROM + JOIN handling (data sources)
  const fromC = get("from");
  const joinCs = clauses.filter(c => c.kw.endsWith("join"));
  const dataSourceOrder = [];
  if (fromC) {
    // Handle comma-separated tables in FROM (implicit cross joins)
    const fromParts = splitTopLevelCommas(fromC.toks);
    fromParts.forEach((part, idx) => {
      const ft = extractFirstTable(part);
      if (idx > 0) { ft.joinKind = "CROSS"; ft.onToks = null; }
      dataSourceOrder.push(ft);
    });
  }
  joinCs.forEach(jc => {
    const kind = detectJoinKind(jc);
    const tgt = extractFirstTable(jc.toks);
    const onIdx = jc.toks.findIndex(t => t.v.toLowerCase() === "on");
    let onToks = onIdx >= 0 ? jc.toks.slice(onIdx + 1) : null;
    if (onToks) {
      while (onToks.length && JOIN_MODS.includes(onToks[onToks.length-1].v.toLowerCase())) onToks.pop();
    }
    dataSourceOrder.push({ ...tgt, joinKind: kind, onToks });
  });

  if (dataSourceOrder.length) {
    const base = dataSourceOrder[0];
    let desc = "Read rows from table ";
    desc += `<span class="chip table">${esc(base.name)}</span>`;
    if (base.alias && base.alias !== base.name) desc += ` (alias <span class="chip table">${esc(base.alias)}</span>)`;
    const joins = dataSourceOrder.slice(1);
    if (joins.length) {
      desc += " then combine with " + joins.map(j => {
        let s = `<span class="chip table">${esc(j.name)}</span>`;
        if (j.alias && j.alias !== j.name) s += ` (alias <span class="chip table">${esc(j.alias)}</span>)`;
        return s;
      }).join(", ");
    }
    let joinViz = "";
    if (joins.length) {
      joinViz = `<div class="join-viz">` +
        `<div class="join-table">${esc(base.name)}${base.alias && base.alias !== base.name ? ` <span class="small-alias">(${esc(base.alias)})</span>` : ""}</div>`;
      joins.forEach(j => {
        const jk = j.joinKind.toLowerCase();
        const help = JOIN_HELP[jk] || "";
        joinViz += `<div class="join-op"><b>${esc(j.joinKind.toUpperCase())} JOIN</b><br>` +
          (j.onToks ? `<span class="chip cond">${esc(toText(j.onToks))}</span>` : "no condition") +
          (help ? `<div class="join-help">${esc(help)}</div>` : "") +
          `</div><div class="join-table">${esc(j.name)}${j.alias && j.alias !== j.name ? ` <span class="small-alias">(${esc(j.alias)})</span>` : ""}</div>`;
      });
      joinViz += `</div>`;
    }
    stages.push({
      title: legPrefix + "Data Sources (FROM / JOIN)",
      type: "from",
      desc,
      body: joinViz
    });
  }

  // WHERE
  const whereC = get("where");
  if (whereC) {
    stages.push({
      title: legPrefix + "Filter Rows (WHERE)",
      type: "where",
      desc: "Keep only rows where the condition is true — runs <i>before</i> grouping.",
      body: renderConditions(whereC.toks)
    });
  }

  // GROUP BY
  const groupC = get("group");
  if (groupC) {
    const byIdx = groupC.toks.findIndex(t => t.v.toLowerCase() === "by");
    const rest = byIdx >= 0 ? groupC.toks.slice(byIdx+1) : groupC.toks;
    const cols = splitTopLevelCommas(rest).map(p => toText(p)).filter(Boolean);
    stages.push({
      title: legPrefix + "Group Rows (GROUP BY)",
      type: "group",
      desc: "Collapse rows into groups sharing the same values in these columns, so aggregates compute per group.",
      body: cols.map(c => `<span class="chip col">${esc(c)}</span>`).join(" ")
    });
  }

  // SELECT (projections)
  const selectC = get("select");
  if (selectC) {
    const distinct = selectC.toks[0] && selectC.toks[0].v.toLowerCase() === "distinct";
    const exprToks = distinct ? selectC.toks.slice(1) : selectC.toks;
    const exprs = splitTopLevelCommas(exprToks);
    let body = "";
    if (distinct) body += `<span class="chip kw">DISTINCT</span> `;
    exprs.forEach(e => {
      const txt = toText(e);
      const overIdx = containsWindowFunc(e);
      if (/case/i.test(txt)) {
        body += renderCase(e);
      } else if (overIdx >= 0) {
        body += renderWindowFunc(e, overIdx);
      } else {
        const agg = containsAgg(e);
        body += `<span class="chip ${agg?'agg':'col'}">${esc(txt)}</span> `;
      }
    });
    stages.push({
      title: legPrefix + "Project Columns (SELECT)",
      type: "select",
      desc: "Choose which columns/expressions appear in the output." + (distinct ? " Remove duplicate result rows." : ""),
      body
    });
  }

  // HAVING
  const havingC = get("having");
  if (havingC) {
    stages.push({
      title: legPrefix + "Filter Groups (HAVING)",
      type: "having",
      desc: "Like WHERE, but applied to <i>aggregated groups</i> — runs after GROUP BY.",
      body: renderConditions(havingC.toks)
    });
  }

  // QUALIFY
  const qualifyC = get("qualify");
  if (qualifyC) {
    stages.push({
      title: legPrefix + "Filter Window Results (QUALIFY)",
      type: "qualify",
      desc: "BigQuery: filter rows based on the result of a window function (like WHERE, but for window outputs).",
      body: renderConditions(qualifyC.toks)
    });
  }

  // ORDER BY
  const orderC = get("order");
  if (orderC) {
    const byIdx = orderC.toks.findIndex(t => t.v.toLowerCase() === "by");
    const rest = byIdx >= 0 ? orderC.toks.slice(byIdx+1) : orderC.toks;
    const parts = splitTopLevelCommas(rest);
    let body = "";
    parts.forEach(p => {
      let dir = "asc", toks = p;
      if (toks.length >= 1) {
        const last = toks[toks.length-1];
        if (last.type === "word" && /^(asc|desc)$/i.test(last.v)) {
          dir = last.v.toLowerCase(); toks = toks.slice(0, -1);
        }
      }
      body += `<span class="chip col">${esc(toText(toks))}</span> <span class="order-dir ${dir}">${dir.toUpperCase()}</span> `;
    });
    stages.push({
      title: legPrefix + "Sort Results (ORDER BY)",
      type: "order",
      desc: "Order the final result set by the columns above.",
      body
    });
  }

  // LIMIT
  const limitC = get("limit");
  if (limitC) {
    stages.push({
      title: legPrefix + "Limit Rows (LIMIT)",
      type: "limit",
      desc: "Keep only the first <span class='chip kw'>" + esc(toText(limitC.toks)) + "</span> rows.",
      body: ""
    });
  }

  // CLUSTER BY
  const clusterC = get("cluster");
  if (clusterC) {
    const byIdx = clusterC.toks.findIndex(t => t.v.toLowerCase() === "by");
    const rest = byIdx >= 0 ? clusterC.toks.slice(byIdx+1) : clusterC.toks;
    const cols = splitTopLevelCommas(rest).map(p => toText(p)).filter(Boolean);
    stages.push({
      title: legPrefix + "Cluster By (CLUSTER BY)",
      type: "cluster",
      desc: "BigQuery: co-locate rows sharing these column values for storage/performance (applied before LIMIT).",
      body: cols.map(c => `<span class="chip col">${esc(c)}</span>`).join(" ")
    });
  }

  // WINDOW
  const windowC = get("window");
  if (windowC) {
    stages.push({
      title: legPrefix + "Named Windows (WINDOW)",
      type: "window",
      desc: "BigQuery: define reusable window specifications referenced by OVER(...) in SELECT.",
      body: `<span class="chip kw">${esc(toText(windowC.toks))}</span>`
    });
  }

  return stages;
}

function analyze(sql) {
  const tokens = tokenize(sql).filter(t => t.v !== ";");
  const cteNames = collectCTENames(tokens);
  const scopes = buildScopes(tokens, cteNames);

  const legs = splitUnionLegs(tokens);
  let stages = [];
  if (legs.length === 1) {
    stages = analyzeLeg(legs[0].toks);
  } else {
    legs.forEach((leg, idx) => {
      const legStages = analyzeLeg(leg.toks, `[Leg ${idx+1}] `);
      stages = stages.concat(legStages);
      if (idx < legs.length - 1) {
        stages.push({
          title: `Combine Results (${leg.nextOp})`,
          type: "union",
          desc: `Combine the rows from the query legs above and below using <span class="chip kw">${esc(leg.nextOp)}</span>.`,
          body: ""
        });
      }
    });
  }

  return { stages, scopes };
}

// Collect every (SELECT ...) group in the query (including CTE bodies and
// nested subqueries) as an independent "scope" so each can be visualized on
// its own tab. The main query is always the first scope.
function collectQueryScopes(tokens, cteNames){
  const scopes = [];
  const seen = new Set();
  const cteBodies = extractCTEBodies(tokens);
  function addScope(label, kind, bodyToks){
    if (!bodyToks || !bodyToks.length) return;
    const key = kind + "|" + toText(bodyToks).toLowerCase();
    if (seen.has(key)) return;
    seen.add(key);
    scopes.push({ label, kind, bodyToks });
  }
  addScope("Main query", "main", tokens);
  // walk the token stream looking for balanced "( SELECT ... )" groups
  for (let i = 0; i < tokens.length; i++){
    if (tokens[i].v === "(" && i + 1 < tokens.length && tokens[i+1].v.toLowerCase() === "select"){
      let d = 1, j = i + 1;
      for (; j < tokens.length; j++){
        if (tokens[j].v === "(") d++;
        else if (tokens[j].v === ")"){ d--; if (d === 0) break; }
      }
      const bodyToks = tokens.slice(i + 1, j); // excludes the outer parens
      // alias follows the closing paren: ") [AS] alias"
      let label = "subquery", kind = "subq";
      const after = tokens[j + 1];
      if (after){
        if (after.v.toLowerCase() === "as" && tokens[j + 2]) label = stripTicks(tokens[j + 2].v);
        else if (after.type === "word" && !isKeyword(after.v)) label = stripTicks(after.v);
      }
      // if this body is a named CTE, label it as such
      if (cteNames && cteBodies){
        for (const [cn, cb] of Object.entries(cteBodies)){
          if (toText(cb).toLowerCase() === toText(bodyToks).toLowerCase()){
            label = cn; kind = "cte"; break;
          }
        }
      }
      addScope(label, kind, bodyToks);
    }
  }
  return scopes;
}

// Build all scopes (main query + each subquery/CTE) as independent ER models.
function buildScopes(tokens, cteNames){
  const raw = collectQueryScopes(tokens, cteNames);
  return raw.map((sc, idx) => ({
    label: sc.label,
    kind: sc.kind,
    index: idx,
    er: buildScopeER(sc.bodyToks, cteNames)
  }));
}

// Build an entity-relationship model for a single scope (one query body):
// tables + the real JOIN links within that scope. Subquery/CTE sources appear
// as opaque derived-table nodes (their internals live on their own tab), so no
// phantom "contains" links are drawn.
function buildScopeER(bodyToks, cteNames){
  const tables = [];
  const seen = new Set();
  const links = [];

  // Helper: add a table entry if not already seen, return its key
  function addTable(name, alias, origin, cteName) {
    const baseKey = (alias || name).toLowerCase();
    const key = cteName ? cteName + "." + baseKey : baseKey;
    if (!seen.has(key)) {
      const isUnnest = stripTicks(name).toLowerCase().startsWith("unnest(");
      const tbl = { name, alias, key, cols: [], allCols: [],
                    origin: origin || (isUnnest ? "std" : "std"), colMeta: {},
                    cteName: cteName || null };
      if (isUnnest) {
        const inner = stripTicks(name).slice(7, -1);
        const dot = inner.lastIndexOf(".");
        if (dot >= 0) tbl.cols.push(stripTicks(inner.slice(dot + 1)));
      }
      tables.push(tbl);
    }
    return key;
  }

  // Helper: add a join link between two table keys
  function addLink(fromKey, toKey, left, right, leftCol, rightCol, kind) {
    links.push({ from: fromKey, to: toKey, left, right, leftCol, rightCol, kind });
    addCol(tables, fromKey, leftCol, "cols");
    addCol(tables, toKey, rightCol, "cols");
  }

  // --- Process this scope's own FROM/JOIN sources ---
  const sources = extractSourcesFromTokens(bodyToks);
  sources.forEach((s, idx) => {
    const isSubq = cteNames.includes(stripTicks(s.name).toLowerCase()) || s.isSubquery;
    const key = addTable(s.name, s.alias, isSubq ? "subq" : "std", null);
    if (idx > 0) {
      const pairs = s.onToks ? parseOnPairs(s.onToks) : [];
      if (pairs.length) {
        pairs.forEach(p => {
          const fromKey = resolveTableKey(tables, p.left);
          const toKey = resolveTableKey(tables, p.right);
          addLink(fromKey, toKey, p.left, p.right, colOf(p.left), colOf(p.right), s.joinKind);
        });
      } else {
        addLink(tables[0].key, key, null, null, null, null, s.joinKind);
      }
    }
  });

  // grab every referenced column within this scope
  collectAllColumns(bodyToks, tables);
  // attach per-column metadata badges (GRP / SORT / FILTER / CASE / PK)
  annotateColumns(tables, bodyToks, cteNames);
  return { tables, links };
}

// Extract CTE names from a WITH clause: `name AS ( ... )`
function collectCTENames(tokens){
  const names = [];
  for (let i=0;i<tokens.length;i++){
    if (tokens[i].type==="word" && tokens[i].v.toLowerCase()==="with"){
      let j = i+1;
      // skip RECURSIVE keyword if present
      if (j < tokens.length && tokens[j].v.toLowerCase() === "recursive") j++;
      let depth = 0;
      while (j < tokens.length){
        if (tokens[j].v === "(") depth++;
        else if (tokens[j].v === ")") depth--;
        if (depth === 0 && tokens[j].type==="word" && !isKeyword(tokens[j].v) && tokens[j].v!=="("){
          const nm = stripTicks(tokens[j].v).toLowerCase();
          if (tokens[j+1] && tokens[j+1].v.toLowerCase()==="as" &&
              tokens[j+2] && tokens[j+2].v==="("){
            if (!names.includes(nm)) names.push(nm);
          }
        }
        // only break on top-level SELECT (the main query body)
        if (depth === 0 && tokens[j].v.toLowerCase()==="select") break;
        j++;
      }
    }
  }
  return names;
}

// Extract each CTE's body tokens: { cteName: token[] }
// Handles balanced parens to capture the full CTE body.
function extractCTEBodies(tokens){
  const bodies = {};
  for (let i=0;i<tokens.length;i++){
    if (tokens[i].type==="word" && tokens[i].v.toLowerCase()==="with"){
      let j = i+1;
      // skip RECURSIVE keyword if present
      if (j < tokens.length && tokens[j].v.toLowerCase() === "recursive") j++;
      let scanDepth = 0;
      while (j < tokens.length){
        if (tokens[j].v === "(") scanDepth++;
        else if (tokens[j].v === ")") scanDepth--;
        // look for: cte_name AS ( at top level only
        if (scanDepth === 0 && tokens[j].type==="word" && !isKeyword(tokens[j].v) && tokens[j].v!=="(" &&
            tokens[j+1] && tokens[j+1].v.toLowerCase()==="as" &&
            tokens[j+2] && tokens[j+2].v==="("){
          const nm = stripTicks(tokens[j].v).toLowerCase();
          let depth = 0, bodyStart = j+2;
          for (let k = bodyStart; k < tokens.length; k++){
            if (tokens[k].v==="(") depth++;
            else if (tokens[k].v===")"){ depth--; if(depth===0){
              bodies[nm] = tokens.slice(bodyStart+1, k);
              scanDepth = 0;
              j = k;
              break;
            }}
          }
        }
        // only break on top-level SELECT (the main query body)
        if (scanDepth === 0 && tokens[j].v.toLowerCase()==="select") break;
        j++;
      }
    }
  }
  return bodies;
}

// Extract FROM/JOIN data sources from a token array (reused for CTE bodies).
function extractSourcesFromTokens(toks){
  const clauses = splitClauses(toks);
  const get = (k) => clauses.find(c => c.kw === k || c.kw === k + " by");
  const fromC = get("from");
  const joinCs = clauses.filter(c => c.kw.endsWith("join"));
  const sources = [];
  if (fromC) {
    const fromParts = splitTopLevelCommas(fromC.toks);
    fromParts.forEach((part, idx) => {
      const tbl = extractFirstTable(part);
      if (idx > 0) { tbl.joinKind = "CROSS"; tbl.onToks = null; }
      sources.push(tbl);
    });
  }
  joinCs.forEach(jc => {
    const kind = detectJoinKind(jc);
    const tgt = extractFirstTable(jc.toks);
    const onIdx = jc.toks.findIndex(t => t.v.toLowerCase() === "on");
    let onToks = onIdx >= 0 ? jc.toks.slice(onIdx + 1) : null;
    if (onToks) {
      while (onToks.length && JOIN_MODS.includes(onToks[onToks.length-1].v.toLowerCase())) onToks.pop();
    }
    sources.push({ ...tgt, joinKind: kind, onToks });
  });
  return sources;
}

// Add GRP / SORT / FILTER / CASE badges to columns of the relevant tables.
function annotateColumns(tables, tokens, cteNames){
  if (!tokens) return;
  const keyFor = (ref) => {
    const dot = ref.indexOf(".");
    if (dot < 0) return tables.length ? tables[0].key : null;
    const t = stripTicks(ref.slice(0, dot)).toLowerCase();
    let hit = tables.find(tb => tb.alias.toLowerCase()===t || stripTicks(tb.name).toLowerCase()===t);
    if (hit) return hit.key;
    // Try CTE-prefixed keys
    hit = tables.find(tb => tb.key.endsWith("." + t));
    return hit ? hit.key : tables[0].key;
  };
  function mark(ref, badge){
    const dot = ref.indexOf(".");
    if (dot < 0) return;
    const key = keyFor(ref);
    const col = colOf(ref);
    const tb = tables.find(t => t.key===key);
    if (!tb) return;
    tb.colMeta[col] = tb.colMeta[col] || new Set();
    tb.colMeta[col].add(badge);
  }
  // extract clauses by simple keyword scan on token list (top-level)
  let i=0, depth=0;
  let cur = [];
  const clauses = {};
  while (i < tokens.length){
    const tk = tokens[i];
    if (tk.v==="(") depth++;
    else if (tk.v===")") depth--;
    if (depth===0 && tk.type==="word"){
      const w = tk.v.toLowerCase();
      if (["where","group","order","having"].includes(w)){
        // capture until next top-level clause head
        let j=i+1; const buf=[]; let d2=0;
        while (j<tokens.length){
          const t2=tokens[j];
          if (t2.v==="(") d2++;
          else if (t2.v===")") d2--;
          if (d2===0 && t2.type==="word" && ["where","group","order","having","limit","union","from","select"].includes(t2.v.toLowerCase())) break;
          buf.push(t2); j++;
        }
        clauses[w] = buf;
        i=j; continue;
      }
    }
    i++;
  }
  // GROUP BY -> GRP
  if (clauses.group){
    const by = clauses.group.findIndex(t=>t.v.toLowerCase()==="by");
    splitTopLevelCommas(by>=0?clauses.group.slice(by+1):clauses.group)
      .forEach(p=>{ const txt=toText(p); const dot=txt.indexOf("."); if(dot>=0) mark(txt,"grp"); });
  }
  // ORDER BY -> SORT
  if (clauses.order){
    const by = clauses.order.findIndex(t=>t.v.toLowerCase()==="by");
    splitTopLevelCommas(by>=0?clauses.order.slice(by+1):clauses.order)
      .forEach(p=>{ const txt=toText(p).replace(/\s+(asc|desc)$/i,""); const dot=txt.indexOf("."); if(dot>=0) mark(txt,"sort"); });
  }
  // WHERE -> FILTER
  if (clauses.where){
    // find qualified column refs inside condition
    for (let k=0;k<clauses.where.length-2;k++){
      if (clauses.where[k].type==="word" && clauses.where[k+1].v==="." && clauses.where[k+2].type==="word"){
        const ref = clauses.where[k].v+"."+clauses.where[k+2].v;
        // skip if it's part of a larger dotted path already handled
        mark(ref,"filt");
      }
    }
  }
  // CASE columns: mark `a.b` references that fall inside a CASE..END block
  if (tokens){
    let depth = 0;
    for (let k=0;k<tokens.length;k++){
      const w = tokens[k].v.toLowerCase();
      if (w === "case") depth++;
      else if (w === "end") depth = Math.max(0, depth-1);
      if (depth > 0 && k+2 < tokens.length &&
          tokens[k].type==="word" && tokens[k+1].v==="." && tokens[k+2].type==="word" &&
          !isKeyword(tokens[k].v) && !isKeyword(tokens[k+2].v)){
        mark(tokens[k].v+"."+tokens[k+2].v, "case");
      }
    }
  }
}

function colOf(ref){
  if (!ref) return null;
  const dot = ref.lastIndexOf(".");
  return dot < 0 ? ref : ref.slice(dot + 1);
}
function tblOf(ref){
  if (!ref) return null;
  const dot = ref.lastIndexOf(".");
  return dot < 0 ? null : ref.slice(0, dot);
}
// BigQuery uses backticks for quoted identifiers; strip them for matching.
function stripTicks(s){
  if (!s) return s;
  return s.replace(/`/g, "");
}
function addCol(tables, key, col, bucket){
  if (!col) return;
  const tb = tables.find(t => t.key === key);
  if (!tb) return;
  const list = tb[bucket] || tb.cols;
  if (!list.includes(col)) list.push(col);
}

// Collect every `alias.col` / `table.col` reference across the whole query and
// assign each column to its owning table. Unqualified columns go to the first
// (FROM) table as a best-effort guess.
function collectAllColumns(tokens, tables){
  // build alias/name -> key lookup
  const keys = tables.map(t => t.key);
  const keyFor = (ref) => {
    const dot = ref.indexOf(".");
    if (dot < 0) return tables.length ? tables[0].key : null;
    const t = stripTicks(ref.slice(0, dot)).toLowerCase();
    let hit = tables.find(tb => tb.alias.toLowerCase() === t || stripTicks(tb.name).toLowerCase() === t);
    if (hit) return hit.key;
    // Try CTE-prefixed keys
    hit = tables.find(tb => tb.key.endsWith("." + t));
    return hit ? hit.key : tables[0].key;
  };
  let i = 0;
  while (i < tokens.length){
    const tk = tokens[i];
    // pattern: word . word  where first word is a known alias/table
    if (tk.type === "word" && i+2 < tokens.length &&
        tokens[i+1].v === "." && tokens[i+2].type === "word" &&
        !isKeyword(tokens[i].v) && !isKeyword(tokens[i+2].v)){
      const ref = tk.v + "." + tokens[i+2].v;
      const key = keyFor(ref);
      addCol(tables, key, colOf(ref), "allCols");
      i += 3; continue;
    }
    i++;
  }
}

function resolveTableKey(tables, ref){
  // ref is "alias.col" or "table.col" or "col" or "ctePrefix.alias.col"
  if (!ref) return null;
  const dot = ref.indexOf(".");
  if (dot < 0) return tables.length ? tables[0].key : null;
  const firstPart = stripTicks(ref.slice(0, dot)).toLowerCase();
  // Try exact match on alias/name
  let hit = tables.find(tb => tb.alias.toLowerCase() === firstPart || stripTicks(tb.name).toLowerCase() === firstPart);
  if (hit) return hit.key;
  // Try CTE-prefixed keys (e.g. alias "o" matches key "customer_spending.o")
  hit = tables.find(tb => tb.key.endsWith("." + firstPart));
  if (hit) return hit.key;
  // Try full key match (for refs like "ctePrefix.alias.col")
  hit = tables.find(tb => tb.key === firstPart || tb.key.endsWith("." + firstPart));
  return hit ? hit.key : firstPart;
}

function parseOnPairs(toks){
  // expect: A.x = B.y  (optionally multiple joined by AND)
  // Also handles >=, <=, <>, !=, >, < and keyword operators (BETWEEN, LIKE, IN)
  const pairs = [];
  let depth = 0, cur = [];
  const segs = [];
  for (const t of toks){
    if (t.v === "(") depth++; else if (t.v === ")") depth--;
    if (depth === 0 && t.type === "word" && t.v.toLowerCase() === "and") { segs.push(cur); cur = []; }
    else cur.push(t);
  }
  if (cur.length) segs.push(cur);
  const CMP_OPS = new Set(["=", ">=", "<=", "<>", "!=", ">", "<"]);
  segs.forEach(seg => {
    const opIdx = seg.findIndex(t => CMP_OPS.has(t.v));
    if (opIdx > 0) {
      const left = toText(seg.slice(0, opIdx));
      const right = toText(seg.slice(opIdx+1));
      pairs.push({ left, right, op: seg[opIdx].v });
    } else {
      // Fallback: extract qualified column references for BETWEEN, LIKE, IN etc.
      const refs = [];
      for (let k = 0; k < seg.length - 2; k++) {
        if (seg[k].type === "word" && seg[k+1].v === "." && seg[k+2].type === "word" &&
            !isKeyword(seg[k].v)) {
          refs.push(seg[k].v + "." + seg[k+2].v);
        }
      }
      if (refs.length >= 2) {
        pairs.push({ left: refs[0], right: refs[1], op: "?" });
      }
    }
  });
  return pairs;
}

// ---------- helpers ----------
function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function extractFirstTable(toks) {
  // find table name word, then optional alias
  let i = 0;
  while (i < toks.length && toks[i].v.toLowerCase() === "(" ) { i++; }
  // skip leading subquery/opening

  // --- parenthesized subquery as a data source: (SELECT ... ) [AS] alias ---
  if (toks.length && toks[0].v === "(") {
    // find the matching closing paren for the opening one
    let depth = 0, closeIdx = -1;
    for (let k = 0; k < toks.length; k++) {
      if (toks[k].v === "(") depth++;
      else if (toks[k].v === ")") { depth--; if (depth === 0) { closeIdx = k; break; } }
    }
    const innerToks = closeIdx > 0 ? toks.slice(1, closeIdx) : [];
    // alias follows the closing paren: `) as result` or `) result`
    let alias = null;
    const after = toks[closeIdx + 1];
    if (after) {
      if (after.v.toLowerCase() === "as" && toks[closeIdx + 2]) alias = stripTicks(toks[closeIdx + 2].v);
      else if (after.type === "word" && !isKeyword(after.v)) alias = stripTicks(after.v);
    }
    return {
      name: alias || "(subquery)",
      alias: alias || "(subquery)",
      isSubquery: true,
      innerToks
    };
  }

  let name = null, alias = null;
  for (let j=0;j<toks.length;j++){
    const isBacktick = toks[j].v.startsWith("`") && toks[j].v.endsWith("`");
    if ((toks[j].type==="word" && !isKeyword(toks[j].v) && toks[j].v!=="(") || isBacktick) {
      name = toks[j].v;
      // BigQuery: a backtick-quoted identifier may contain dots
      // (e.g. `project.dataset.table`) — keep it intact.
      if (name.startsWith("`") && name.endsWith("`")) {
        // strip the backticks for a cleaner label
        name = name.slice(1, -1);
      }
      // BigQuery: UNNEST(array) — mark as a table-like source
      else if (name.toLowerCase() === "unnest") {
        // capture the array expression up to the closing paren
        let depth = 0, expr = [];
        for (let k = j; k < toks.length; k++) {
          if (toks[k].v === "(") depth++;
          else if (toks[k].v === ")") { depth--; if (depth === 0) { expr.push(toks[k]); break; } }
          expr.push(toks[k]);
        }
        name = toText(expr);
        // look for alias after the closing paren
        // find the position of the closing paren in the original token list
        let closeIdx = j;
        let d = 0;
        for (let k = j; k < toks.length; k++) {
          if (toks[k].v === "(") d++;
          else if (toks[k].v === ")") { d--; if (d === 0) { closeIdx = k; break; } }
        }
        const afterClose = toks[closeIdx + 1];
        if (afterClose) {
          if (afterClose.v.toLowerCase() === "as" && toks[closeIdx + 2]) alias = toks[closeIdx + 2].v;
          else if (afterClose.type === "word" && !isKeyword(afterClose.v)) alias = afterClose.v;
        }
      } else {
        // Consume multi-part dotted names (schema.table, catalog.schema.table)
        while (j + 2 < toks.length && toks[j+1].v === "." &&
               (toks[j+2].type === "word" || (toks[j+2].v.startsWith("`") && toks[j+2].v.endsWith("`")))) {
          name += "." + stripTicks(toks[j+2].v);
          j += 2;
        }
      }
      // alias: next word if not keyword, or after AS
      // (skip for UNNEST — alias was already captured above after the closing paren)
      if (!alias) {
        const nx = toks[j+1];
        if (nx) {
          if (nx.v.toLowerCase() === "as" && toks[j+2]) alias = toks[j+2].v;
          else if (nx.type === "word" && !isKeyword(nx.v)) alias = nx.v;
        }
      }
      break;
    }
  }
  return { name, alias: alias || name, isSubquery: false, innerToks: [] };
}

function detectJoinKind(jc) {
  // the join modifier is part of the clause head keyword, e.g. "left join"
  const head = jc.kw.split(" ");
  let kind = "INNER";
  for (const w of head) {
    if (w === "join") break;
    if (w === "outer") {
      // "OUTER" only implies FULL when no real direction precedes it
      // (e.g. "FULL OUTER JOIN" or bare "OUTER JOIN"); otherwise it is a
      // redundant qualifier on an already-specified LEFT/RIGHT/FULL join.
      if (kind === "INNER") kind = "FULL";
    } else if (JOIN_MODS.includes(w)) {
      kind = w.toUpperCase();
    }
  }
  return kind;
}

function containsAgg(toks){
  return toks.some(t => t.type==="word" && isAgg(t.v));
}

function renderConditions(toks){
  // split by top-level AND / OR
  const parts = [];
  let depth=0, cur=[];
  for (const t of toks){
    if (t.v==="(") depth++; else if (t.v===")") depth--;
    if (depth===0 && t.type==="word" && /^(and|or)$/i.test(t.v)){
      parts.push({ conj: t.v.toLowerCase(), toks: cur }); cur=[];
    } else cur.push(t);
  }
  if (cur.length) parts.push({ conj: null, toks: cur });
  let html = "";
  parts.forEach((p,idx)=>{
    if (idx>0 && p.conj) html += ` <span class="chip kw">${p.conj.toUpperCase()}</span> `;
    html += `<span class="chip cond">${esc(toText(p.toks))}</span>`;
  });
  return html;
}

function renderCase(toks){
  // find WHEN ... THEN ... ELSE ... END
  let html = `<div class="case-box">`;
  let i=0;
  while (i<toks.length){
    const t = toks[i];
    if (t.v.toLowerCase()==="when"){
      let cond=[]; i++;
      while(i<toks.length && toks[i].v.toLowerCase()!=="then"){ cond.push(toks[i]); i++; }
      html += `<div><span class="when">WHEN</span> <span class="chip cond">${esc(toText(cond))}</span> `;
    } else if (t.v.toLowerCase()==="then"){
      let res=[]; i++;
      while(i<toks.length && !["when","else","end"].includes(toks[i].v.toLowerCase())){ res.push(toks[i]); i++; }
      html += `<span class="then">THEN</span> <span class="chip col">${esc(toText(res))}</span></div>`;
    } else if (t.v.toLowerCase()==="else"){
      let res=[]; i++;
      while(i<toks.length && toks[i].v.toLowerCase()!=="end"){ res.push(toks[i]); i++; }
      html += `<div><span class="else">ELSE</span> <span class="chip col">${esc(toText(res))}</span></div>`;
    } else if (t.v.toLowerCase()==="end"){
      i++;
    } else if (t.v.toLowerCase()==="case"){
      html += `<span class="chip case">CASE</span> `; i++;
    } else {
      i++;
    }
  }
  html += `</div>`;
  return html;
}

// ---------- render ----------
function render(stages){
  const el = document.getElementById("pipeline");
  if (!stages.length){
    el.innerHTML = `<div class="empty-state">No recognizable clauses found. Try a SELECT statement.</div>`;
    return;
  }
  let html = "";
  stages.forEach((s,idx)=>{
    html += `<div class="stage">
      <div class="stage-head">
        <div class="stage-num">${idx+1}</div>
        <div class="stage-title">${esc(s.title)}</div>
        <div class="stage-type">${esc(s.type)}</div>
      </div>
      <div class="stage-desc">${s.desc}</div>
      <div class="stage-body">${s.body}</div>
    </div>`;
    if (idx < stages.length-1) html += `<div class="arrow"></div>`;
  });
  el.innerHTML = html;
  el.scrollTop = 0;
}

// ---------- ER diagram rendering ----------
// Implements the blueprint: 24px grid, layered BFS column layout with
// barycenter sorting, straight join paths, facing side-ports, color-coded
// join types, midpoint badges and port dots.
const GRID_SIZE = 24;
const TABLE_WIDTH = 224;
const HEADER_HEIGHT = 44;
const ROW_HEIGHT = 32;
const COL_SPACING = 288;   // min horizontal column spacing
const MIN_GAP = 48;        // min vertical gap between stacked tables (2 dots)
const SEP_GAP = 56;        // hard minimum gap enforced between any two tables
const ROOT_LEFT = true;    // first column drawn on the left

const JOIN_COLORS = {
  INNER: "#4f46e5",
  LEFT:  "#10b981",
  RIGHT: "#f59e0b",
  FULL:  "#ec4899",
  CROSS: "#a855f7",
  SUBQUERY_LINK: "#8b5cf6",
  LINK:  "#8b5cf6"
};
const JOIN_DEFAULT_COLOR = "#94a3b8";

// Orthogonal routing parameters: joins are routed around cards on the 24px
// grid, with costs that penalize turns, hugging cards, and cells already used
// by earlier joins (so parallel links fan out instead of overlapping).
const ROUTE_CELL = GRID_SIZE;
const TABLE_CLEARANCE = 16;      // path clearance around card edges
const TURN_PENALTY = 3.5;        // extra cost per 90-degree elbow
const EDGE_USE_PENALTY = 2.2;    // extra cost per cell used by a prior join
const PROX_PENALTY = 0.35;       // extra cost for cells touching a card

function snap(v){ return Math.round(v / GRID_SIZE) * GRID_SIZE; }

// Word-wrap a table's display name to fit inside TABLE_WIDTH. Returns an array
// of lines. Uses an approximate per-character width for the mono header font.
const NAME_CHAR_W = 7.4;            // approx px per char at 13px mono
const NAME_MAX_W = TABLE_WIDTH - 34; // usable width (left dot/pad + right pad)
const NAME_LINE_H = 16;             // line height for wrapped name
function tableNameLines(t){
  const disp = t.alias && t.alias !== t.name ? `${t.alias} · ${t.name}` : t.name;
  const maxChars = Math.max(1, Math.floor(NAME_MAX_W / NAME_CHAR_W));
  if (disp.length <= maxChars) return [disp];
  const words = disp.split(/(\s+)/); // keep separators to rejoin
  const lines = [];
  let cur = "";
  for (const w of words){
    if ((cur + w).length <= maxChars){ cur += w; continue; }
    if (cur.trim()) lines.push(cur.trim());
    // hard-break a single token longer than a line
    let rem = w;
    while (rem.length > maxChars){
      lines.push(rem.slice(0, maxChars));
      rem = rem.slice(maxChars);
    }
    cur = rem;
  }
  if (cur.trim()) lines.push(cur.trim());
  return lines.length ? lines : [disp];
}
function headerHeight(t){
  const lines = tableNameLines(t).length;
  return HEADER_HEIGHT + (lines - 1) * NAME_LINE_H;
}
function tableHeight(t){ return headerHeight(t) + t.dispCols.length * ROW_HEIGHT; }

// ---------- orthogonal join routing ----------
// Builds padded obstacle rects around every card so routes stay clear.
function buildObstacles(tables, pos){
  return tables.map((t, i) => ({
    x0: pos[i].x - TABLE_CLEARANCE,
    y0: pos[i].y - TABLE_CLEARANCE,
    x1: pos[i].x + TABLE_WIDTH + TABLE_CLEARANCE,
    y1: pos[i].y + tableHeight(t) + TABLE_CLEARANCE
  }));
}

function segIntersect(ax, ay, bx, by, cx, cy, dx, dy){
  const rx = bx - ax, ry = by - ay, sx = dx - cx, sy = dy - cy;
  const denom = rx * sy - ry * sx;
  if (Math.abs(denom) < 1e-9) return null;
  const t = ((cx - ax) * sy - (cy - ay) * sx) / denom;
  const u = ((cx - ax) * ry - (cy - ay) * rx) / denom;
  if (t <= 0 || t >= 1 || u <= 0 || u >= 1) return null;
  return { x: ax + t * rx, y: ay + t * ry };
}

// Routes an orthogonal elbow path from port p1 to port p2 around table cards.
// n1 / n2 are the outward normals (+1 = facing +x, -1 = facing -x) so the
// path leaves each port perpendicular to its card edge. `usedMap` tracks cells
// taken by already-routed joins so later links spread apart. Falls back to a
// straight line if no route is found.
function routeOrthogonal(p1, n1, p2, n2, obstacles, usedMap){
  if (!obstacles || !obstacles.length) return [p1, p2];
  const sPt = { x: p1.x + n1 * ROUTE_CELL, y: p1.y };
  const tPt = { x: p2.x + n2 * ROUTE_CELL, y: p2.y };

  let minX = Math.min(p1.x, p2.x), minY = Math.min(p1.y, p2.y);
  let maxX = Math.max(p1.x, p2.x), maxY = Math.max(p1.y, p2.y);
  obstacles.forEach(o => {
    minX = Math.min(minX, o.x0); minY = Math.min(minY, o.y0);
    maxX = Math.max(maxX, o.x1); maxY = Math.max(maxY, o.y1);
  });
  const pad = ROUTE_CELL * 2;
  minX -= pad; minY -= pad; maxX += pad; maxY += pad;

  const gx0 = Math.floor(minX / ROUTE_CELL), gy0 = Math.floor(minY / ROUTE_CELL);
  const W = Math.ceil((maxX - minX) / ROUTE_CELL) + 1;
  const H = Math.ceil((maxY - minY) / ROUTE_CELL) + 1;
  const N = W * H;
  const idx = (cx, cy) => cy * W + cx;
  const cxOf = i => i % W;
  const cyOf = i => (i / W) | 0;

  // blocked cells = any card rect (with clearance); prox counts blocked
  // neighbours so the path floats off card edges instead of hugging them.
  const blocked = new Uint8Array(N);
  const prox = new Float64Array(N);
  for (let cy = 0; cy < H; cy++){
    const y0 = gy0 * ROUTE_CELL + cy * ROUTE_CELL;
    const y1 = y0 + ROUTE_CELL;
    for (let cx = 0; cx < W; cx++){
      const x0 = gx0 * ROUTE_CELL + cx * ROUTE_CELL;
      const x1 = x0 + ROUTE_CELL;
      const i = idx(cx, cy);
      for (let k = 0; k < obstacles.length; k++){
        const o = obstacles[k];
        if (x1 > o.x0 && x0 < o.x1 && y1 > o.y0 && y0 < o.y1){ blocked[i] = 1; break; }
      }
    }
  }
  for (let cy = 0; cy < H; cy++){
    for (let cx = 0; cx < W; cx++){
      const i = idx(cx, cy);
      if (blocked[i]) continue;
      let c = 0;
      if (cx > 0 && blocked[i - 1]) c++;
      if (cx < W - 1 && blocked[i + 1]) c++;
      if (cy > 0 && blocked[i - W]) c++;
      if (cy < H - 1 && blocked[i + W]) c++;
      prox[i] = c;
    }
  }

  function nearestFree(pt, maxR){
    const cc = Math.floor(pt.x / ROUTE_CELL) - gx0;
    const cr = Math.floor(pt.y / ROUTE_CELL) - gy0;
    let best = -1, bestD = Infinity;
    for (let r = 0; r <= maxR; r++){
      for (let dy = -r; dy <= r; dy++){
        for (let dx = -r; dx <= r; dx++){
          if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
          const cxx = cc + dx, cyy = cr + dy;
          if (cxx < 0 || cxx >= W || cyy < 0 || cyy >= H) continue;
          const i = idx(cxx, cyy);
          if (blocked[i]) continue;
          const d2 = dx * dx + dy * dy;
          if (d2 < bestD){ bestD = d2; best = i; }
        }
      }
    }
    return best;
  }

  const start = nearestFree(sPt, 8);
  const goal = nearestFree(tPt, 8);
  if (start < 0 || goal < 0) return [p1, p2];

  const INF = 1e12;
  const g = new Float64Array(N).fill(INF);
  const came = new Int32Array(N).fill(-1);
  const closed = new Uint8Array(N);
  const h = i => Math.abs(cxOf(i) - cxOf(goal)) + Math.abs(cyOf(i) - cyOf(goal));

  const heap = [];
  function heapPush(i, score){
    const item = [i, score];
    heap.push(item);
    let k = heap.length - 1;
    while (k > 0){
      const p = (k - 1) >> 1;
      if (heap[p][1] <= score) break;
      heap[k] = heap[p];
      k = p;
    }
    heap[k] = item;
  }
  function heapPop(){
    const top = heap[0];
    const last = heap.pop();
    if (heap.length && last !== top){
      heap[0] = last;
      let k = 0;
      for (;;){
        let best = k;
        const l = k * 2 + 1, r = k * 2 + 2;
        if (l < heap.length && heap[l][1] < heap[best][1]) best = l;
        if (r < heap.length && heap[r][1] < heap[best][1]) best = r;
        if (best === k) break;
        const tmp = heap[k]; heap[k] = heap[best]; heap[best] = tmp;
        k = best;
      }
    }
    return top;
  }

  g[start] = 0;
  heapPush(start, h(start));
  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  let found = -1;
  let guard = 0;
  while (heap.length && guard < N * 6){
    guard++;
    const cur = heapPop()[0];
    if (closed[cur]) continue;
    closed[cur] = 1;
    if (cur === goal){ found = cur; break; }
    const prev = came[cur];
    const dirX = prev >= 0 ? cxOf(cur) - cxOf(prev) : 0;
    const dirY = prev >= 0 ? cyOf(cur) - cyOf(prev) : 0;
    for (let d = 0; d < 4; d++){
      const nxc = cxOf(cur) + DIRS[d][0], nyc = cyOf(cur) + DIRS[d][1];
      if (nxc < 0 || nxc >= W || nyc < 0 || nyc >= H) continue;
      const ni = idx(nxc, nyc);
      if (closed[ni] || blocked[ni]) continue;
      let stepCost = 1 + prox[ni] * PROX_PENALTY;
      if (prev >= 0 && (DIRS[d][0] !== dirX || DIRS[d][1] !== dirY)) stepCost += TURN_PENALTY;
      stepCost += (usedMap.get(ni) || 0) * EDGE_USE_PENALTY;
      const ng = g[cur] + stepCost;
      if (ng < g[ni]){
        g[ni] = ng;
        came[ni] = cur;
        heapPush(ni, ng + h(ni));
      }
    }
  }
  if (found < 0) return [p1, p2];

  const cells = [];
  let c = found;
  while (c !== -1){ cells.push(c); c = came[c]; }
  cells.reverse();
  cells.forEach(cc2 => usedMap.set(cc2, (usedMap.get(cc2) || 0) + 1));

  // grid centers -> pixel points with horizontal port stubs; drop collinear points
  const pts = [{ x: p1.x, y: p1.y }, { x: sPt.x, y: sPt.y }];
  for (const cc2 of cells){
    pts.push({ x: (cxOf(cc2) + gx0) * ROUTE_CELL + ROUTE_CELL / 2,
               y: (cyOf(cc2) + gy0) * ROUTE_CELL + ROUTE_CELL / 2 });
  }
  pts.push({ x: tPt.x, y: tPt.y }, { x: p2.x, y: p2.y });

  // split the tiny diagonal joins between a port stub and a cell centre into
  // axis-aligned L corners so the whole path stays orthogonal
  const ortho = [pts[0]];
  for (let i = 1; i < pts.length; i++){
    const a = ortho[ortho.length - 1], b = pts[i];
    if (a.x !== b.x && a.y !== b.y) ortho.push({ x: a.x, y: b.y });
    ortho.push(b);
  }

  const dedup = [ortho[0]];
  for (let i = 1; i < ortho.length; i++){
    const a = dedup[dedup.length - 1], b = ortho[i];
    if (Math.abs(a.x - b.x) > 0.01 || Math.abs(a.y - b.y) > 0.01) dedup.push(b);
  }
  const simple = [dedup[0]];
  for (let i = 1; i < dedup.length - 1; i++){
    const a = dedup[i - 1], b = dedup[i], c2 = dedup[i + 1];
    const cross = (b.x - a.x) * (c2.y - b.y) - (c2.x - b.x) * (b.y - a.y);
    if (Math.abs(cross) > 0.01) simple.push(b);
  }
  simple.push(dedup[dedup.length - 1]);
  return simple;
}

// Convert an orthogonal polyline into an SVG path with rounded elbows.
function orthoPathD(pts, r){
  if (!pts || pts.length < 2) return "";
  let d = `M ${pts[0].x} ${pts[0].y}`;
  for (let i = 1; i < pts.length - 1; i++){
    const a = pts[i - 1], b = pts[i], c = pts[i + 1];
    const inX = Math.sign(b.x - a.x), inY = Math.sign(b.y - a.y);
    const outX = Math.sign(c.x - b.x), outY = Math.sign(c.y - b.y);
    if (inX === outX && inY === outY){
      d += ` L ${b.x} ${b.y}`;
      continue;
    }
    const segIn = Math.abs(b.x - a.x) + Math.abs(b.y - a.y);
    const segOut = Math.abs(c.x - b.x) + Math.abs(c.y - b.y);
    const rr = Math.max(1, Math.min(r, segIn / 2, segOut / 2));
    const ax = b.x - inX * rr, ay = b.y - inY * rr;
    const cx2 = b.x + outX * rr, cy2 = b.y + outY * rr;
    d += ` L ${ax} ${ay} Q ${b.x} ${b.y} ${cx2} ${cy2}`;
  }
  const last = pts[pts.length - 1];
  d += ` L ${last.x} ${last.y}`;
  return d;
}

function renderER(scopes, targetId, activeIdx){
  const el = document.getElementById(targetId || "erDiagram");
  if (!scopes || !scopes.length){
    el.innerHTML = `<div class="er-empty">JOIN relationships will appear here.</div>`;
    return;
  }
  if (activeIdx == null || activeIdx < 0 || activeIdx >= scopes.length) activeIdx = 0;
  const scope = scopes[activeIdx];
  const er = scope.er;

  // tab bar (only when there is more than one scope)
  let tabsHtml = "";
  if (scopes.length > 1){
    tabsHtml = `<div class="er-tabs">`;
    scopes.forEach((sc, i) => {
      const cls = i === activeIdx ? "er-tab active" : "er-tab " + (sc.kind || "");
      tabsHtml += `<button class="${cls}" data-scope="${i}">${esc(sc.label)}</button>`;
    });
    tabsHtml += `</div>`;
  }

  // empty scope
  if (!er || !er.tables.length){
    el.innerHTML = tabsHtml + `<div class="er-empty">No tables in this query.</div>`;
    wireERTabs(el, targetId, scopes);
    return;
  }

  // display set = all columns when the toggle is on, else just join columns
  const showAll = document.getElementById("erAllCols") &&
                  document.getElementById("erAllCols").checked;
  er.tables.forEach(t => {
    const display = showAll ? t.allCols : t.cols;
    t.dispCols = display && display.length ? display.slice() : ["*"];
  });

  const n = er.tables.length;
  const idxOf = (key) => er.tables.findIndex(t => t.key === key);
  const edges = er.links
    .map(l => ({ a: idxOf(l.from), b: idxOf(l.to), l }))
    .filter(e => e.a >= 0 && e.b >= 0);

  // --- adjacency list (undirected) ---
  const adj = Array.from({ length: n }, () => []);
  edges.forEach(e => { adj[e.a].push(e.b); adj[e.b].push(e.a); });
  const degree = (i) => adj[i].length;

  // --- find connected components ---
  const compOf = new Array(n).fill(-1);
  const comps = [];
  for (let i=0;i<n;i++){
    if (compOf[i] !== -1) continue;
    const q = [i]; compOf[i] = comps.length;
    const nodes = [];
    while (q.length){
      const u = q.pop(); nodes.push(u);
      adj[u].forEach(v => { if (compOf[v] === -1){ compOf[v] = compOf[u]; q.push(v); } });
    }
    comps.push(nodes);
  }

  // --- force-directed layout per component ---
  // Replaces the old strict column layout. Tables are pushed apart by
  // repulsion, pulled together along joins, and separated so that a hub
  // joined to many tables fans out in a square/rectangle instead of a line,
  // keeping inter-join links visible.
  const pos = er.tables.map(() => ({ x: 0, y: 0 }));

  function layoutComponent(nodes){
    const m = nodes.length;
    if (m === 0) return;
    const set = new Set(nodes);
    const compEdges = edges.filter(e => set.has(e.a) && set.has(e.b));
    const hAvg = nodes.reduce((s,u)=> s + tableHeight(er.tables[u]), 0) / m;
    const k = Math.max(COL_SPACING * 0.42, (hAvg + MIN_GAP) * 0.5);

    const px = {}, py = {};
    // Radial initial placement using BFS starting from highest-degree node
    let startNode = nodes[0];
    let maxDeg = -1;
    nodes.forEach(u => {
      const deg = adj[u].filter(v => set.has(v)).length;
      if (deg > maxDeg) {
        maxDeg = deg;
        startNode = u;
      }
    });

    const q = [startNode];
    const placed = new Set([startNode]);
    px[startNode] = 0;
    py[startNode] = 0;

    while (q.length) {
      const u = q.shift();
      const neighbors = adj[u].filter(v => set.has(v) && !placed.has(v));
      const count = neighbors.length;
      neighbors.forEach((v, idx) => {
        const angle = (idx / count) * 2 * Math.PI;
        px[v] = px[u] + k * Math.cos(angle);
        py[v] = py[u] + k * Math.sin(angle);
        placed.add(v);
        q.push(v);
      });
    }

    let temp = k * 2.2;
    const iters = 500;
    for (let it = 0; it < iters; it++){
      const dispX = {}, dispY = {};
      nodes.forEach(u => { dispX[u] = 0; dispY[u] = 0; });
      // repulsion between every pair
      for (let a = 0; a < m; a++){
        for (let b = a + 1; b < m; b++){
          const u = nodes[a], v = nodes[b];
          let dx = px[u] - px[v], dy = py[u] - py[v];
          let dist = Math.hypot(dx, dy) || 0.01;
          const minX = TABLE_WIDTH + SEP_GAP;
          const minY = (tableHeight(er.tables[u]) + tableHeight(er.tables[v])) / 2 + SEP_GAP;
          let f = (k * k) / dist;
          if (Math.abs(dx) < minX && Math.abs(dy) < minY) f *= 3;
          const fx = (dx / dist) * f, fy = (dy / dist) * f;
          dispX[u] += fx; dispY[u] += fy;
          dispX[v] -= fx; dispY[v] -= fy;
        }
      }
      // attraction along join edges
      compEdges.forEach(e => {
        const u = e.a, v = e.b;
        let dx = px[u] - px[v], dy = py[u] - py[v];
        let dist = Math.hypot(dx, dy) || 0.01;
        const f = (dist * dist) / (k * 0.72);
        const fx = (dx / dist) * f, fy = (dy / dist) * f;
        dispX[u] -= fx; dispY[u] -= fy;
        dispX[v] += fx; dispY[v] += fy;
      });
      // edge-crossing penalty/repulsion: push nodes away from join lines
      compEdges.forEach(e => {
        const u = e.a, v = e.b;
        nodes.forEach(w => {
          if (w === u || w === v) return;
          const x0 = px[w], y0 = py[w];
          const x1 = px[u], y1 = py[u];
          const x2 = px[v], y2 = py[v];
          const dx = x2 - x1, dy = y2 - y1;
          const l2 = dx*dx + dy*dy;
          if (l2 < 10) return;
          let t = ((x0 - x1)*dx + (y0 - y1)*dy) / l2;
          t = Math.max(0, Math.min(1, t));
          const pxClosest = x1 + t*dx;
          const pyClosest = y1 + t*dy;
          const dist = Math.hypot(x0 - pxClosest, y0 - pyClosest) || 0.01;
          const minClearance = TABLE_WIDTH * 0.8;
          if (dist < minClearance) {
            const f = (minClearance - dist) * 0.12;
            const fx = ((x0 - pxClosest) / dist) * f;
            const fy = ((y0 - pyClosest) / dist) * f;
            dispX[w] += fx; dispY[w] += fy;
            dispX[u] -= fx * 0.5; dispY[u] -= fy * 0.5;
            dispX[v] -= fx * 0.5; dispY[v] -= fy * 0.5;
          }
        });
      });
      // edge-edge crossing reduction: push the endpoints of crossing joins
      // away from the intersection so they untangle over the annealing loop
      for (let e1i = 0; e1i < compEdges.length; e1i++){
        for (let e2i = e1i + 1; e2i < compEdges.length; e2i++){
          const e1 = compEdges[e1i], e2 = compEdges[e2i];
          if (e1.a === e2.a || e1.a === e2.b || e1.b === e2.a || e1.b === e2.b) continue;
          const X = segIntersect(px[e1.a], py[e1.a], px[e1.b], py[e1.b],
                                 px[e2.a], py[e2.a], px[e2.b], py[e2.b]);
          if (!X) continue;
          const f = Math.min(2.2, k * 0.03);
          [[e1.a, e1.b], [e2.a, e2.b]].forEach(pair => {
            pair.forEach(nd => {
              const dx = px[nd] - X.x, dy = py[nd] - X.y;
              const dist = Math.hypot(dx, dy) || 0.01;
              dispX[nd] += (dx / dist) * f;
              dispY[nd] += (dy / dist) * f;
            });
          });
        }
      }
      // move
      nodes.forEach(u => {
        const d = Math.hypot(dispX[u], dispY[u]) || 0.01;
        const lim = Math.min(d, temp);
        px[u] += (dispX[u] / d) * lim;
        py[u] += (dispY[u] / d) * lim;
      });
      temp *= 0.985;
    }

    // hard bounding-box separation pass
    for (let pass = 0; pass < 600; pass++){
      let worst = 0;
      for (let a = 0; a < m; a++){
        for (let b = a + 1; b < m; b++){
          const u = nodes[a], v = nodes[b];
          const wu = TABLE_WIDTH, wv = TABLE_WIDTH;
          const hu = tableHeight(er.tables[u]), hv = tableHeight(er.tables[v]);
          const ox = (wu + wv) / 2 + SEP_GAP - Math.abs(px[u] - px[v]);
          const oy = (hu + hv) / 2 + SEP_GAP - Math.abs((py[u] + hu/2) - (py[v] + hv/2));
          if (ox > 0 && oy > 0){
            worst = Math.max(worst, Math.min(ox, oy));
            if (ox < oy){
              const dir = px[u] <= px[v] ? -1 : 1;
              px[u] += dir * ox / 2; px[v] -= dir * ox / 2;
            } else {
              const dir = py[u] <= py[v] ? -1 : 1;
              py[u] += dir * oy / 2; py[v] -= dir * oy / 2;
            }
          }
        }
      }
      if (worst < 0.5) break;
    }

    return { px, py, k };
  }

  // Separate components into connected (>= 2 tables) and singletons
  const connectedComps = comps.filter(nodes => nodes.length > 1);
  const singletonComps = comps.filter(nodes => nodes.length === 1);

  let offsetX = 0;
  let globalMaxY = 0;
  let globalMaxX = 0;

  connectedComps.forEach(nodes => {
    const { px, py, k } = layoutComponent(nodes);
    let maxX = -1e9;
    nodes.forEach(u => {
      pos[u].x = px[u] + offsetX;
      pos[u].y = py[u];
      maxX = Math.max(maxX, px[u] + TABLE_WIDTH);
      globalMaxY = Math.max(globalMaxY, py[u] + tableHeight(er.tables[u]));
    });
    globalMaxX = Math.max(globalMaxX, offsetX + maxX);
    offsetX += maxX + COL_SPACING * 0.8;
  });

  // Tidy alignment for singleton tables below the main connected components
  if (singletonComps.length > 0) {
    let currentX = 0;
    let currentY = connectedComps.length ? globalMaxY + SEP_GAP + 24 : 0;
    let rowMaxHeight = 0;
    const colSpacing = TABLE_WIDTH + SEP_GAP + 24;

    singletonComps.forEach(comp => {
      const u = comp[0];
      const tHeight = tableHeight(er.tables[u]);
      if (connectedComps.length && currentX + TABLE_WIDTH > globalMaxX) {
        currentX = 0;
        currentY += rowMaxHeight + SEP_GAP + 24;
        rowMaxHeight = 0;
      }
      pos[u].x = currentX;
      pos[u].y = currentY;
      rowMaxHeight = Math.max(rowMaxHeight, tHeight);
      currentX += colSpacing;
    });
  }

  // --- bounds ---
  let minX=1e9, minY=1e9, maxX=-1e9, maxY=-1e9;
  er.tables.forEach((t,i)=>{
    minX=Math.min(minX,pos[i].x); minY=Math.min(minY,pos[i].y);
    maxX=Math.max(maxX,pos[i].x+TABLE_WIDTH); maxY=Math.max(maxY,pos[i].y+tableHeight(t));
  });
  const PAD = 24;
  const offX = PAD - minX, offY = PAD - minY;
  er.tables.forEach((_,i)=>{ pos[i].x+=offX; pos[i].y+=offY; });

  // final separation pass on the actual (unsnapped) positions. Split each
  // overlap between BOTH tables so a single push can't shove one table into a
  // third; include the grid size in the required gap so the final snap() below
  // can never round two tables back into a visual overlap.
  const SNAP_SLACK = GRID_SIZE;
  for (let pass = 0; pass < 1000; pass++){
    let worst = 0;
    for (let a = 0; a < n; a++){
      for (let b = a + 1; b < n; b++){
        const wu = TABLE_WIDTH, wv = TABLE_WIDTH;
        const hu = tableHeight(er.tables[a]), hv = tableHeight(er.tables[b]);
        const ox = (wu + wv) / 2 + SEP_GAP + SNAP_SLACK - Math.abs(pos[a].x - pos[b].x);
        const oy = (hu + hv) / 2 + SEP_GAP + SNAP_SLACK - Math.abs((pos[a].y + hu/2) - (pos[b].y + hv/2));
        if (ox > 0 && oy > 0){
          worst = Math.max(worst, Math.min(ox, oy));
          if (ox < oy){
            const dir = pos[a].x <= pos[b].x ? -1 : 1;
            pos[a].x += dir * ox / 2;
            pos[b].x -= dir * ox / 2;
          } else {
            const dir = pos[a].y <= pos[b].y ? -1 : 1;
            pos[a].y += dir * oy / 2;
            pos[b].y -= dir * oy / 2;
          }
        }
      }
    }
    if (worst < 0.5) break;
  }

  // snap to grid last (SNAP_SLACK above guarantees post-snap gap stays
  // positive so grid rounding can't reintroduce a visual overlap).
  er.tables.forEach((_,i)=>{ pos[i].x = snap(pos[i].x); pos[i].y = snap(pos[i].y); });

  // recompute bounds and re-apply padding so the diagram fits the viewport
  minX=1e9; minY=1e9; maxX=-1e9; maxY=-1e9;
  er.tables.forEach((t,i)=>{
    minX=Math.min(minX,pos[i].x); minY=Math.min(minY,pos[i].y);
    maxX=Math.max(maxX,pos[i].x+TABLE_WIDTH); maxY=Math.max(maxY,pos[i].y+tableHeight(t));
  });
  const offX2 = PAD - minX, offY2 = PAD - minY;
  er.tables.forEach((_,i)=>{ pos[i].x+=offX2; pos[i].y+=offY2; });
  minX+=offX2; minY+=offY2; maxX+=offX2; maxY+=offY2;

  function getPortCoordinates(i, col, faceRight, yOffset = 0){
    const t = er.tables[i];
    const ci = t.dispCols.indexOf(col);
    const x = faceRight ? pos[i].x + TABLE_WIDTH : pos[i].x;
    const y = pos[i].y + headerHeight(t) + (ci < 0 ? 0 : ci*ROW_HEIGHT) + ROW_HEIGHT/2 + yOffset;
    return { x, y };
  }

  // Pre-calculate port usage for fanning out overlapping lines
  const portCounts = {};
  const portIndices = {};
  edges.forEach(ed => {
    const l = ed.l;
    const k1 = ed.a + "_" + (l.leftCol || "*");
    const k2 = ed.b + "_" + (l.rightCol || "*");
    portCounts[k1] = (portCounts[k1] || 0) + 1;
    portCounts[k2] = (portCounts[k2] || 0) + 1;
  });

  // obstacle rects for routing (every card, padded) + per-cell usage so
  // parallel joins fan out along their whole length, not just at the port
  const obstacles = buildObstacles(er.tables, pos);
  const usedMap = new Map();
  const darkKinds = new Set(["LEFT","RIGHT","FULL","CROSS"]);

  // --- route every join before the canvas bounds are finalized ---
  const joinMarkup = [];
  let rMinX = minX, rMinY = minY, rMaxX = maxX, rMaxY = maxY;
  edges.forEach(ed => {
    const l = ed.l;
    const color = JOIN_COLORS[(l.kind||"").toUpperCase()] || JOIN_DEFAULT_COLOR;
    const aCx = pos[ed.a].x + TABLE_WIDTH/2;
    const bCx = pos[ed.b].x + TABLE_WIDTH/2;
    const aRight = bCx >= aCx;
    const bRight = aCx >= bCx;

    const k1 = ed.a + "_" + (l.leftCol || "*");
    const k2 = ed.b + "_" + (l.rightCol || "*");
    const idx1 = portIndices[k1] || 0;
    portIndices[k1] = idx1 + 1;
    const idx2 = portIndices[k2] || 0;
    portIndices[k2] = idx2 + 1;

    const total1 = portCounts[k1];
    const total2 = portCounts[k2];
    const offset1 = total1 > 1 ? (idx1 - (total1 - 1) / 2) * 6 : 0;
    const offset2 = total2 > 1 ? (idx2 - (total2 - 1) / 2) * 6 : 0;

    const p1 = getPortCoordinates(ed.a, l.leftCol, aRight, offset1);
    const p2 = getPortCoordinates(ed.b, l.rightCol, bRight, offset2);

    // orthogonal route around the cards (straight-line fallback)
    const pts = routeOrthogonal(p1, aRight ? 1 : -1, p2, bRight ? 1 : -1, obstacles, usedMap);
    const d = orthoPathD(pts, 8);
    pts.forEach(p => {
      if (p.x < rMinX) rMinX = p.x;
      if (p.x > rMaxX) rMaxX = p.x;
      if (p.y < rMinY) rMinY = p.y;
      if (p.y > rMaxY) rMaxY = p.y;
    });

    // midpoint of the routed path (for the badge)
    let mid = p1;
    let total = 0;
